steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/scanbatuk:$COMMIT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/scanbatuk:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'scanbatuk-web',
           '--image', 'gcr.io/$PROJECT_ID/scanbatuk:$COMMIT_SHA',
           '--region', 'asia-southeast2',
           '--platform', 'managed',
           '--allow-unauthenticated',
           '--port', '80']
